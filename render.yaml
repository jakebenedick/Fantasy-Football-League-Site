services:
  - type: web
    name: fourth-down
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SLEEPER_BASE_URL
        value: https://api.sleeper.app/v1
      - key: SLEEPER_TIMEOUT_SECONDS
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: fourth-dahn-stats
          property: connectionString

databases:
  - name: fourth-dahn-stats
    plan: free
    databaseName: fourth_dahn_stats
    user: fourth_dahn
